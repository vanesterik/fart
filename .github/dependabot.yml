# Dependabot opens a pull request when a dependency has a newer release, in
# place of tools warning about it on every run (pyright's warning is silenced
# in Taskfile.yml and .lefthook.yml). For a check on demand, run
# `task outdated`.
#
# There is no CI: check a Dependabot pull request out locally and run
# `task check` (or push to it, which runs the pre-push gate) before merging.
#
# Minor and patch updates arrive grouped, one pull request for the dev tools
# and one for the runtime dependencies; each major update arrives on its own,
# since that's where breaking changes live.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
