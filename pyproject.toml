[project]
name = "fartt"
version = "0.1.0"
description = "Financial Analysis Real Time Trading"
authors = [{ name = "Koen van Esterik", email = "koen@vanesterik.dev" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"


dependencies = [
    "babel>=2.17.0",
    "ccxt>=4.5.85",
    "click>=8.3.1",
    "jupyter>=1.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "mplfinance>=0.12.10b0",
    "numpy>=2.3.5",
    "pillow>=12.0.0",
    "polars>=1.36.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.12.5",
    "python-bitvavo-api>=1.4.3",
    "python-dotenv>=1.0.1",
    "rich>=14.2.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "ta-lib>=0.7.1",
    "tabulate>=0.9.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.17",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[project.scripts]
fartt = "fartt.cli:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fartt"]


[tool.pyright]
include = ["src"]
exclude = ["tests"]
typeCheckingMode = "strict"
stubPath = "typings"


[tool.pytest.ini_options]
# Tests marked `network` call a live exchange API. They are deselected by
# default so the suite, and the lefthook gate that runs it, stays offline;
# run them with `uv run pytest -m network`. Strict markers turn a misspelt
# marker into an error instead of a test that silently always runs.
addopts = ["--strict-markers", "-m", "not network"]
markers = ["network: calls a live exchange API"]
